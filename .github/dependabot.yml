version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns:
          - PyYAML
          - Flask
          - numpy
          - scipy
          - requests
      python-dev-tools:
        patterns:
          - pytest
          - ruff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
